version: 2
updates:
  # Keeps the SHA-pinned actions in CI current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Don't propose versions newer than 7 days: most malicious releases are caught by then.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  # Supabase CLI and Deno pins for the backend (supabase/package.json).
  - package-ecosystem: "npm"
    directory: "/supabase"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  # Edge function imports (supabase/functions/deno.json and deno.lock).
  - package-ecosystem: "deno"
    directory: "/supabase/functions"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  # AI pipeline (US-03): Anthropic SDK + type-checking dev tools.
  - package-ecosystem: "npm"
    directory: "/ai"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  # Add an npm (/app) entry when the app project exists.
