version: 2
updates:
  # Keeps the SHA-pinned actions in CI current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Don't propose versions newer than 7 days: most malicious releases are caught by then.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  # Expo app. Expo SDK packages move together, so they're grouped into one PR;
  # SDK major upgrades are done by hand with `npx expo install --fix`.
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      expo-sdk:
        patterns:
          - "expo"
          - "expo-*"
          - "jest-expo"
          - "eslint-config-expo"
          - "react"
          - "react-dom"
          - "react-native"
          - "react-native-*"
          - "@types/react"
    ignore:
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
  # Add pip (/ai) and Deno entries when those projects exist.
