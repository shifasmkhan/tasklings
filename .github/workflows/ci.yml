name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: static analysis (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A venv avoids the runner's externally-managed system Python (PEP 668).
      - name: Install Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --quiet "semgrep==1.182.0"
      # Findings are surfaced as PR annotations, so they're readable without the raw log.
      # Paths and messages are escaped so file names can't inject workflow commands.
      - name: Run Semgrep
        run: |
          status=0
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan --config p/default --config p/secrets \
            --metrics off --json --output semgrep.json || status=$?
          esc='gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")'
          jq -r ".results[] | \"::error file=\(.path | $esc),line=\(.start.line)::\(.check_id): \(.extra.message | $esc)\"" semgrep.json
          jq -r ".errors[]? | \"::warning::semgrep: \((.message // .type | tostring) | $esc)\"" semgrep.json
          count=$(jq '.results | length' semgrep.json)
          echo "Semgrep findings: $count (exit $status)"
          [ "$count" -eq 0 ] && [ "$status" -eq 0 ]

  # Migrations, RLS, RPCs and rollover against a throwaway local Supabase. No secrets needed.
  db-tests:
    name: database tests (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Supabase CLI pinned in supabase/package.json, integrity-checked by the lockfile.
      - name: Install pinned tools
        run: npm ci --no-audit --no-fund
      # Postgres and Auth only (Auth owns the auth schema); everything else is excluded.
      - name: Start local Supabase
        run: >-
          npx --no-install supabase start
          -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Lint database functions
        run: npx --no-install supabase db lint --level warning --fail-on error
      # The summary is surfaced as an annotation so a run with zero tests is visible without logs.
      - name: Run pgTAP tests
        run: |
          set -o pipefail
          npx --no-install supabase test db 2>&1 | tee "$RUNNER_TEMP/pgtap.log"
          summary=$(grep -E '^(Files=|Result:)' "$RUNNER_TEMP/pgtap.log" | tr '\n' ' ' | tr -d '%\r')
          echo "::notice title=pgTAP::${summary}"
          grep -q '^Result: PASS' "$RUNNER_TEMP/pgtap.log"
      - name: Stop local Supabase
        if: always()
        run: npx --no-install supabase stop --no-backup

  functions:
    name: edge function tests (deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Deno pinned in supabase/package.json; function deps pinned in supabase/functions/deno.lock.
      - name: Install pinned tools
        run: npm ci --no-audit --no-fund
      - name: Format, lint, type-check and test
        env:
          NO_COLOR: "1"
        run: |
          set -o pipefail
          npm run -s test:functions 2>&1 | tee "$RUNNER_TEMP/deno.log"
          summary=$(grep -E '^(ok|FAILED) \|' "$RUNNER_TEMP/deno.log" | tail -1 | tr -d '%\r')
          echo "::notice title=deno test::${summary}"

  app:
    name: app (typecheck, lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23"
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Lockfile only; no install scripts run (none are needed for typecheck, lint or tests).
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test:ci
